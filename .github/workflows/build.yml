name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libdbus-1-dev libglib2.0-dev libgirepository-2.0-dev libcairo2-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            gir1.2-glib-2.0 gir1.2-girepository-3.0 dbus-daemon \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run python -m unittest \
            tests/test_storage.py tests/test_engine.py tests/test_xdg_shortcuts.py \
            tests/test_mic_rules.py tests/test_press_release_state.py \
            tests/test_window_detector.py

      - name: Build standalone binary
        run: ./build.sh

      # The app runs until interrupted, so surviving the timeout (exit 124)
      # means it started; a broken bundle crashes at import and exits early.
      - name: Smoke test binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          status=0
          dbus-run-session -- timeout -s INT -k 5 10 dist/pushie --minimized || status=$?
          if [ "$status" -ne 124 ]; then
            echo "Binary exited early with status $status"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pushie-linux-x86_64
          path: dist/pushie
          if-no-files-found: error

      # Rolling release: move the `release` tag to this commit and replace the binary.
      # GitHub only; skipped on other forges that run this workflow.
      - name: Update release
        if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f release
          git push -f origin release
          if ! gh release view release >/dev/null 2>&1; then
            gh release create release --title "Compiled single binary" \
              --notes "Latest build of the main branch."
          fi
          gh release upload release dist/pushie --clobber
